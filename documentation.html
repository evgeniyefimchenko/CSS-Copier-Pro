<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title data-i18n="documentationPageTitle"></title>
    <style>
        body { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif; padding: 20px; max-width: 800px; margin: 20px auto; line-height: 1.7; color: #333; background-color: #f9f9f9; }
        .container { background-color: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2, h3 { color: #2c3e50; }
        h1 { text-align: center; margin-bottom: 1.5em; font-size: 2em;}
        h2 { border-bottom: 2px solid #eaecef; padding-bottom: 0.4em; margin-top: 2em; margin-bottom: 1em; font-size: 1.6em;}
        h3 { margin-top: 1.5em; font-size: 1.3em; color: #34495e;}
        p, li { font-size: 1rem; color: #555; margin-bottom: 0.8em; }
        ul, ol { padding-left: 30px; margin-bottom: 1em;}
        li { margin-bottom: 0.5em; }
        code, kbd { background-color: #e8e8e8; padding: 3px 6px; border-radius: 4px; font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; font-size: 0.9em; }
        a { color: #007bff; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .note { background-color: #e7f3fe; border-left: 4px solid #2196F3; padding: 15px; margin: 20px 0; border-radius: 4px;}
        .note p:last-child { margin-bottom: 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="docTitle" data-i18n="documentationPageTitle"></h1>
        <p id="docIntro" data-i18n="documentationIntro"></p>

        <h2 id="docUsageHeading" data-i18n="documentationUsageHeading"></h2>
        <p id="docUsageStep1" data-i18n="docUsageStep1"></p>
        <ul>
            <li id="docUsageStep1_OptA" data-i18n="docUsageStep1_OptA"></li>
            <li id="docUsageStep1_OptB" data-i18n="docUsageStep1_OptB"></li>
            <li id="docUsageStep1_OptC" data-i18n="docUsageStep1_OptC"></li>
        </ul>
        <p id="docUsageStep2" data-i18n="docUsageStep2"></p>
        <p id="docUsageStep3" data-i18n="docUsageStep3"></p>
        <p id="docUsageStep4" data-i18n="docUsageStep4"></p>

        <h2 id="docOptionsHeading" data-i18n="documentationOptionsHeading"></h2>
        <p id="docOptionsDesc" data-i18n="docOptionsDesc"></p>
        <ul>
            <li id="docOptionsLi1" data-i18n="docOptionsLi1"></li>
            <li id="docOptionsLi2" data-i18n="docOptionsLi2"></li>
        </ul>

        <h2 id="docOutputHeading" data-i18n="docOutputHeading"></h2>
        <p id="docOutputDesc1" data-i18n="docOutputDesc1"></p>
        <p id="docOutputDesc2" data-i18n="docOutputDesc2"></p>
        <p id="docOutputDesc3" data-i18n="docOutputDesc3"></p>
        <p id="docOutputDesc4" data-i18n="docOutputDesc4"></p>

        <h2 id="docShortcutHeading" data-i18n="docShortcutHeading"></h2>
        <p id="docShortcutDesc" data-i18n="docShortcutDesc"></p>
        
        <h2 id="docTroubleshootingHeading" data-i18n="docTroubleshootingHeading"></h2>
        <h3><span id="docTrouble1Prob" data-i18n="docTrouble1Prob"></span></h3>
        <p id="docTrouble1Sol" data-i18n="docTrouble1Sol"></p>
        <h3><span id="docTrouble2Prob" data-i18n="docTrouble2Prob"></span></h3>
        <p id="docTrouble2Sol" data-i18n="docTrouble2Sol"></p>

    </div>
    <script src="i18n.js"></script>
</body>
</html>
